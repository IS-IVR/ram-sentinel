          }
          if (-not $compiler) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed: $LASTEXITCODE" }
          }
          if (-not $compiler -and $programFilesX86) {
            $candidate = Join-Path $programFilesX86 'Inno Setup 6\ISCC.exe'
            if (Test-Path -LiteralPath $candidate -PathType Leaf) { $compiler = $candidate }
