name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ram-sentinel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore .\ram-sentinel.sln

      - name: Build
        run: dotnet build .\ram-sentinel.sln --configuration Release --no-restore

      - name: Run memory pressure logic checks
        run: dotnet run --project .\tests\RamSentinel.Core.Tests\RamSentinel.Core.Tests.csproj --configuration Release --no-build

      - name: Publish standalone x64 app
        run: dotnet publish .\src\RamSentinel.App\RamSentinel.App.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true --output .\artifacts\win-x64

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ram-sentinel-win-x64
          path: .\artifacts\win-x64\
          if-no-files-found: error
