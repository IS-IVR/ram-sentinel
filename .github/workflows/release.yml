name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ram-sentinel-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build release assets
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Validate version tag and main-branch ancestry
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+)$') {
            throw "Release tags must use the exact vMAJOR.MINOR.PATCH format (example: v1.2.3)."
          }

          $version = $Matches.version
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          git fetch origin main --no-tags
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Refusing to release: the tagged commit is not reachable from main."
          }

      - name: Restore
        run: dotnet restore ./ram-sentinel.sln

      - name: Build
        run: dotnet build ./ram-sentinel.sln --configuration Release --no-restore

      - name: Run Core logic checks
        run: dotnet run --project ./tests/RamSentinel.Core.Tests/RamSentinel.Core.Tests.csproj --configuration Release --no-build

      - name: Run Windows process inventory integration checks
        run: dotnet run --project ./tests/RamSentinel.App.Tests/RamSentinel.App.Tests.csproj --configuration Release --no-build

      - name: Run inventory soak harness smoke check
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'ram-sentinel-release-smoke.csv'
          dotnet run --project ./tools/RamSentinel.InventorySoak/RamSentinel.InventorySoak.csproj --configuration Release --no-build -- --once --output $output

      - name: Publish self-contained x64 application
        shell: pwsh
        run: dotnet publish ./src/RamSentinel.App/RamSentinel.App.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true "-p:Version=$env:APP_VERSION" --output ./artifacts/win-x64

      - name: Verify published executable
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'artifacts/win-x64/RamSentinel.exe'
          if (-not (Test-Path $exe)) {
            throw "The self-contained application executable was not produced: $exe"
          }

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Compile per-user installer and portable archive
        shell: pwsh
        run: |
          $installerOutput = Join-Path $PWD 'artifacts/installer'
          $releaseOutput = Join-Path $PWD 'artifacts/release'
          New-Item -ItemType Directory -Force $installerOutput, $releaseOutput | Out-Null

          $programFilesX86 = [Environment]::GetFolderPath('ProgramFilesX86')
          $iscc = Join-Path $programFilesX86 'Inno Setup 6/ISCC.exe'
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler not found at $iscc"
          }

          & $iscc "/DMyAppVersion=$env:APP_VERSION" "/O$installerOutput" './installer/RamSentinel.iss'
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup compilation failed with exit code $LASTEXITCODE."
          }

          $installer = Join-Path $installerOutput "RAM-Sentinel-Setup-$env:APP_VERSION-x64.exe"
          if (-not (Test-Path $installer)) {
            throw "Installer output is missing: $installer"
          }

          $portable = Join-Path $releaseOutput "RAM-Sentinel-Portable-$env:APP_VERSION-x64.zip"
          Compress-Archive -Path './artifacts/win-x64/*' -DestinationPath $portable -CompressionLevel Optimal
          Copy-Item $installer $releaseOutput

          $checksumLines = Get-ChildItem $releaseOutput -File |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
              "$hash  $($_.Name)"
            }
          [System.IO.File]::WriteAllLines(
            (Join-Path $releaseOutput 'SHA256SUMS.txt'),
            [string[]]$checksumLines,
            [System.Text.Encoding]::ASCII
          )

          Get-ChildItem $releaseOutput -File | Select-Object Name, Length

      - name: Upload release assets for publishing
        uses: actions/upload-artifact@v4
        with:
          name: ram-sentinel-release-assets
          path: ./artifacts/release/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download validated release assets
        uses: actions/download-artifact@v4
        with:
          name: ram-sentinel-release-assets
          path: release-assets

      - name: Create release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          shopt -s nullglob
          files=(release-assets/*)
          if [ "${#files[@]}" -ne 3 ]; then
            echo "Expected installer, portable ZIP, and checksum file; found ${#files[@]} files." >&2
            exit 1
          fi

          gh release create "$GITHUB_REF_NAME" "${files[@]}" --title "RAM Sentinel $version" --generate-notes --verify-tag
